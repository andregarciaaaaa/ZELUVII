<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeluvi — Gestão condominial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="boot-loading">Carregando Zeluvi…</div></div>
  <div id="boot-error"></div>

  <script>
    window.addEventListener("error", function (e) {
      var el = document.getElementById("boot-error");
      if (el) {
        el.style.display = "flex";
        el.innerText = "Não foi possível carregar o Zeluvi. Verifique sua conexão com a internet (React e as fontes são carregados de um CDN) e recarregue a página.\n\nDetalhe técnico: " + (e.message || e);
      }
    });
  </script>

  <script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
